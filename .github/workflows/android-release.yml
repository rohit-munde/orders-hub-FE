# Builds a signed Android App Bundle (.aab) for Google Play, entirely in the cloud.
#
# Run it from GitHub: Actions tab -> "Android release bundle" -> Run workflow.
# When it finishes, download the "ordershub-release-aab" artifact from the run page
# and upload the .aab inside it to Google Play Console.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ORDERSHUB_UPLOAD_KEYSTORE_BASE64  the upload keystore file, base64-encoded
#   ORDERSHUB_UPLOAD_STORE_PASSWORD   keystore password
#   ORDERSHUB_UPLOAD_KEY_ALIAS        key alias inside the keystore
#   ORDERSHUB_UPLOAD_KEY_PASSWORD     key password
name: Android release bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users, for example 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OrdersHubMobile
    env:
      # Play needs a higher version code for every upload; the run number always increases.
      ORDERSHUB_VERSION_CODE: ${{ github.run_number }}
      ORDERSHUB_VERSION_NAME: ${{ inputs.version_name }}
      ORDERSHUB_UPLOAD_STORE_PASSWORD: ${{ secrets.ORDERSHUB_UPLOAD_STORE_PASSWORD }}
      ORDERSHUB_UPLOAD_KEY_ALIAS: ${{ secrets.ORDERSHUB_UPLOAD_KEY_ALIAS }}
      ORDERSHUB_UPLOAD_KEY_PASSWORD: ${{ secrets.ORDERSHUB_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.ORDERSHUB_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ORDERSHUB_UPLOAD_KEYSTORE_BASE64"
          [ -n "$ORDERSHUB_UPLOAD_STORE_PASSWORD" ] || missing="$missing ORDERSHUB_UPLOAD_STORE_PASSWORD"
          [ -n "$ORDERSHUB_UPLOAD_KEY_ALIAS" ] || missing="$missing ORDERSHUB_UPLOAD_KEY_ALIAS"
          [ -n "$ORDERSHUB_UPLOAD_KEY_PASSWORD" ] || missing="$missing ORDERSHUB_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: OrdersHubMobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and test
        run: |
          npx tsc --noEmit
          npx eslint .
          npx jest --ci

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ORDERSHUB_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ORDERSHUB_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build signed bundle
        working-directory: OrdersHubMobile/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: ordershub-release-aab
          path: OrdersHubMobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
